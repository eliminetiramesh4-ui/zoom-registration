  <script>

/*=========================================
CONFIGURATION
=========================================*/

const SCRIPT_URL =
"https://script.google.com/macros/s/https://script.google.com/macros/s/AKfycbwagv6_F_7YwOR4Ngjn18VSxfR_cUs9ia7XVVUMyD12LomIl83SYfTwMTIG66Dmjz_j/exec";

/*=========================================
LOAD WEBINAR DETAILS
=========================================*/

async function loadWebinar(){

const dateElement =
document.getElementById("webinarDate");

const timeElement =
document.getElementById("webinarTime");

try{

const response =
await fetch(
SCRIPT_URL +
"?action=webinar&t=" +
Date.now()
);

if(!response.ok){

throw new Error("Unable to load webinar");

}

const data =
await response.json();

if(
data.status==="success"
){

dateElement.textContent =
data.webinar_date;

timeElement.textContent =
data.webinar_time;

}else{

throw new Error();

}

}catch(error){

console.log(error);

dateElement.textContent =
"NEXT LIVE SESSION";

timeElement.textContent =
"5:00 PM";

}

}

loadWebinar();

/*=========================================
UTM PARAMETERS
=========================================*/

const params =
new URLSearchParams(
window.location.search
);

const fields=[
"utm_source",
"utm_medium",
"utm_campaign",
"utm_content",
"utm_term"
];

fields.forEach(field=>{

const element=
document.getElementById(field);

if(element){

element.value=
params.get(field)||"";

}

});

document.getElementById("page_url").value=
window.location.href;

  /*=========================================
PHONE VALIDATION
=========================================*/

const phone =
document.getElementById("phone");

phone.addEventListener(
"input",
function(){

this.value =
this.value
.replace(/\D/g,"")
.slice(0,10);

}
);

/*=========================================
FORM ELEMENTS
=========================================*/

const form =
document.getElementById("leadForm");

const submitBtn =
document.getElementById("submitBtn");

const successScreen =
document.getElementById("successScreen");

let submitting=false;

/*=========================================
FORM SUBMIT
=========================================*/

form.addEventListener(
"submit",
async function(e){

e.preventDefault();

if(submitting){

return;

}

const mobile =
phone.value.trim();
